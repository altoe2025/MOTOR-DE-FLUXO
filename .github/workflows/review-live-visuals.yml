name: review-live-visuals
on:
  push:
    branches: [codex/main-render-sync]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements/web-dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -r requirements/web-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: npm --prefix web ci
      - run: npx --prefix web playwright install --with-deps chromium
      - run: npm --prefix web run test:e2e -- stage6-visual --update-snapshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-visual-review-linux
          path: |
            web/e2e/stage6-visual.spec.ts-snapshots/*linux.png
            web/test-results/
          retention-days: 7
