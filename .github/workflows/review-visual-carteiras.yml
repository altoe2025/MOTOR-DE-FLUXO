name: Review carteira visual references
on:
  push:
    branches: [codex/carteira-criterios, feat/front-visual]
    paths: [.github/workflows/review-visual-carteiras.yml]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -r requirements/web-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: npm --prefix web ci
      - run: npx --prefix web playwright install --with-deps chromium
      - run: node web/scripts/build-e2e.mjs
      - run: npx playwright test --project=local stage6-visual --update-snapshots
        working-directory: web
        env:
          MOT_E2E_PYTHON: python
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: carteira-linux-visual-review
          path: |
            web/e2e/stage6-visual.spec.ts-snapshots/*linux.png
            web/test-results/
