[project]
name = "motor-de-fluxo"
version = "0.1.0"
description = "Simulador de netting multilateral de fluxo cross-border em contas CNR"
requires-python = ">=3.11"
dependencies = [
    "pyyaml",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]
web = [
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "PyJWT[crypto]==2.14.0",
    "uvicorn==0.52.4",
]
web-dev = [
    "mypy==2.3.1",
    "pip-tools==7.6.1",
    "ruff==0.16.7",
    "types-PyYAML==6.0.12.20260906",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = ["motor", "motor.*"]
follow_imports = "skip"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["motor*", "servidor*"]

[tool.setuptools.package-data]
motor = ["cenarios/*.yaml"]
