[project]
name = "motor-de-fluxo"
version = "0.1.0"
description = "Simulador de netting multilateral de fluxo cross-border em contas CNR"
requires-python = ">=3.11"
dependencies = [
    "pyyaml",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["motor*"]
